[project]
name = "nexum-public-cloud-storage"
version = "0.0.1"
description = "Nexum multicloud file batch and streaming"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dioleti", email = "fabricio@dl.tec.br" }
]
dependencies = [
    "nexum-public-commons>=0.0.1",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "requests>=2.34.2",
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.1"
]
requires-python = ">=3.11"

[project.optional-dependencies]
aws = [
    "boto3>=1.43.45",
    "boto3-stubs~=1.43.45"
]
azure = [
    "azure-core>=1.41.0",
    "azure-storage-blob",
    "azure-identity"
]
google-cloud = [
    "protobuf>=7.35.1",
    "google-cloud-storage>=3.12.1"
]
smb = [
    "smbprotocol>=1.17.0",
    "python3-ldap>=0.9.8.4"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nexum_cloud_storage"]

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
