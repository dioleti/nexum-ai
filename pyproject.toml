[project]
name = "nexum-ai"
version = "1.0.0"
description = "Nexum AI Framework"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dioleti", email = "fabricio@dl.tec.br" }
]
dependencies = [
    "python-dotenv>=1.2.2",
    "pydantic>=2.0",
    "pytesseract>=0.3.10",
    "pdf2image>=1.17.0",
    "Pillow>=10.0.0",
    "pypdf>=3.0.0",
    "requests>=2.34.2",
    "opencv-python>=5.0.0.93",
    "numpy>=2.5.1",
    "pandas>=2.0.0",
    "sentence-transformers>=2.2.0",
    "langchain-core>=1.0.0",
    "layoutparser>=0.3.4",
    "torch>=2.2.2",
    "transformers>=5.17.0",
    "ultralytics>=8.1.0",
    "easyocr>=1.7.2",
    "ipykernel>=7.4.0",
    "weaviate-client>=4.16.7",
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-java",
    "tree-sitter-rust",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
    "tree-sitter-c-sharp"
]
requires-python = ">=3.12"

[project.optional-dependencies]
aws = [
    "boto3>=1.43.45",
    "boto3-stubs~=1.43.45"
]
azure = [
    "azure-core>=1.41.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.17.0"
]
google-cloud = [
    "protobuf>=7.35.1",
    "google-cloud-storage>=3.12.1"
]
smb = [
    "smbprotocol>=1.17.0"
]
datadog = [
    "ddtrace>=4.11.0"
]
elastic = [
    "elastic-apm>=6.26.2"
]

dev = [
    "boto3>=1.43.45",
    "boto3-stubs~=1.43.45",
    "azure-core>=1.41.0",
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.17.0",
    "protobuf>=7.35.1",
    "google-cloud-storage>=3.12.1",
    "smbprotocol>=1.17.0",
    "ddtrace>=4.11.0",
    "elastic-apm>=6.26.2",
    "mypy>=2.3.0",
    "mypy-boto3-s3",
    "pandas-stubs~=3.0.5"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
import_mode = "importlib"

[tool.hatch.build.targets.wheel]
packages = ["src/"]

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"
exclude = [
    "src/nexum/common/logging.py",
    ".venv",
    "tests/"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy-boto3-s3"
]

[tool.ruff]
exclude = ["tests/", "src/nexum/common/logging.py"]

[tool.ruff.lint]
ignore = ["BLE001"]
