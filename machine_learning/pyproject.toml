[project]
name = "nexum-ai-machine-learning"
version = "1.0.0"
description = "Nexum AI Framework"
readme = "README.md"
license = "MIT"
authors = [
    { name = "Dioleti", email = "fabricio@dl.tec.br" }
]
dependencies = [
    "nexum-ai-common>=1.0.1",
    "transformers>=5.20.2",
]
requires-python = ">=3.12"

[project.optional-dependencies]
dev = [
    "mypy",
    "ruff"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
import_mode = "importlib"

[tool.hatch.build.targets.wheel]
packages = ["nexum_ai_machine_learning"]

[tool.mypy]
ignore_missing_imports = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
exclude = [
    ".venv",
    "tests/"
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "mypy-boto3-s3",
    "coverage>=7.6.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "bandit>=1.8.0",
    "pip-audit>=2.7.3",
]

[tool.ruff]
exclude = ["tests/"]

[tool.ruff.lint]
ignore = ["BLE001"]
